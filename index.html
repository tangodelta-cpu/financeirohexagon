<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexagon Finance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
body { background:#1a1a2e; color:#e0e0e0; min-height:100vh; }

/* Login */
#login-screen {
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
}
.login-card {
  background:#1e1e32; border-radius:16px; padding:40px; width:90%; max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.login-card h1 { color:#f97316; font-size:28px; margin-bottom:4px; }
.login-card p { color:#888; margin-bottom:28px; font-size:14px; }
.login-card input {
  width:100%; padding:14px 16px; margin-bottom:14px; border:1px solid #333;
  border-radius:10px; background:#252542; color:#fff; font-size:15px;
  outline:none; transition:border-color .2s;
}
.login-card input:focus { border-color:#f97316; }
.login-card button {
  width:100%; padding:14px; background:#f97316; color:#fff; border:none;
  border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;
  transition:background .2s;
}
.login-card button:hover { background:#ea580c; }
.login-card .error { color:#ef4444; font-size:13px; margin-bottom:12px; display:none; }

/* Dashboard */
#dashboard { display:none; }
.header {
  background:#1e1e32; padding:16px 24px; display:flex; justify-content:space-between;
  align-items:center; border-bottom:1px solid #2d2d4a;
}
.header h1 { color:#f97316; font-size:22px; }
.header .user-info { display:flex; align-items:center; gap:16px; }
.header .user-info span { color:#888; font-size:14px; }
.header .logout-btn {
  background:transparent; color:#ef4444; border:1px solid #ef4444;
  padding:6px 16px; border-radius:8px; cursor:pointer; font-size:13px;
  transition:all .2s;
}
.header .logout-btn:hover { background:#ef4444; color:#fff; }

.container { max-width:1200px; margin:0 auto; padding:20px; }

.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
.card {
  background:#1e1e32; border-radius:12px; padding:20px; border-left:4px solid #f97316;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
}
.card h3 { font-size:13px; color:#888; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.card .value { font-size:28px; font-weight:700; color:#fff; }
.card.pendente { border-left-color:#f97316; }
.card.pago { border-left-color:#22c55e; }
.card.atrasado { border-left-color:#ef4444; }
.card.saldo { border-left-color:#3b82f6; }

.charts-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
@media(max-width:768px){ .charts-row { grid-template-columns:1fr; } }
.chart-box { background:#1e1e32; border-radius:12px; padding:20px; }
.chart-box h3 { font-size:14px; color:#888; margin-bottom:16px; }

.filters { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.filters select, .filters input {
  background:#252542; border:1px solid #333; color:#fff; padding:10px 14px;
  border-radius:8px; font-size:14px; outline:none;
}
.filters select:focus, .filters input:focus { border-color:#f97316; }

table { width:100%; border-collapse:collapse; background:#1e1e32; border-radius:12px; overflow:hidden; margin-bottom:30px; }
th { background:#252542; color:#888; padding:14px 16px; text-align:left; font-size:13px; text-transform:uppercase; letter-spacing:1px; }
td { padding:14px 16px; border-top:1px solid #2d2d4a; font-size:14px; }
.status-badge {
  display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600;
}
.status-badge.pendente { background:#f9731620; color:#f97316; }
.status-badge.pago { background:#22c55e20; color:#22c55e; }
.status-badge.atrasado { background:#ef444420; color:#ef4444; }

.btn-novo {
  background:#f97316; color:#fff; border:none; padding:10px 20px; border-radius:8px;
  font-size:14px; font-weight:600; cursor:pointer; margin-bottom:16px; transition:background .2s;
}
.btn-novo:hover { background:#ea580c; }

.modal-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6);
  align-items:center; justify-content:center; z-index:100;
}
.modal-overlay.active { display:flex; }
.modal {
  background:#1e1e32; border-radius:16px; padding:30px; width:90%; max-width:480px;
  max-height:90vh; overflow-y:auto;
}
.modal h2 { color:#f97316; margin-bottom:20px; font-size:20px; }
.modal label { display:block; color:#888; font-size:13px; margin-bottom:4px; margin-top:14px; }
.modal input, .modal select, .modal textarea {
  width:100%; padding:12px 14px; border:1px solid #333; border-radius:8px;
  background:#252542; color:#fff; font-size:14px; outline:none;
}
.modal input:focus, .modal select:focus { border-color:#f97316; }
.modal .btn-row { display:flex; gap:12px; margin-top:24px; }
.modal .btn-row button { flex:1; padding:12px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
.modal .btn-save { background:#f97316; color:#fff; border:none; }
.modal .btn-save:hover { background:#ea580c; }
.modal .btn-cancel { background:transparent; color:#888; border:1px solid #333; }
.modal .btn-cancel:hover { background:#252542; }

.loading { text-align:center; padding:40px; color:#888; }
.error-msg { color:#ef4444; text-align:center; padding:20px; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <h1>⬡ Hexagon</h1>
    <p>Financeiro — Mineração</p>
    <div class="error" id="login-error">Email ou senha inválidos</div>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="header">
    <h1>⬡ Hexagon Finance</h1>
    <div class="user-info">
      <span id="user-email"></span>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="container">
    <div class="cards" id="cards">
      <div class="card pendente"><h3>A Pagar</h3><div class="value" id="card-pendente">—</div></div>
      <div class="card pago"><h3>Pago no Mês</h3><div class="value" id="card-pago">—</div></div>
      <div class="card atrasado"><h3>Atrasado</h3><div class="value" id="card-atrasado">—</div></div>
      <div class="card saldo"><h3>Total Registrado</h3><div class="value" id="card-total">—</div></div>
    </div>

    <div class="charts-row">
      <div class="chart-box"><h3>📊 Por Categoria</h3><canvas id="chart-categoria" height="200"></canvas></div>
      <div class="chart-box"><h3>📅 Vencimentos do Mês</h3><canvas id="chart-vencimentos" height="200"></canvas></div>
    </div>

    <button class="btn-novo" onclick="abrirModal()">+ Nova Conta</button>

    <div class="filters">
      <select id="filtro-status" onchange="carregarDados()">
        <option value="">Todos os status</option>
        <option value="pendente">Pendentes</option>
        <option value="pago">Pagos</option>
        <option value="atrasado">Atrasados</option>
      </select>
      <input type="month" id="filtro-mes" onchange="carregarDados()">
      <input type="text" id="filtro-busca" placeholder="Buscar conta..." oninput="carregarDados()">
    </div>

    <div id="loading-indicator" class="loading">Carregando...</div>
    <table id="tabela-contas" style="display:none">
      <thead>
        <tr><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Categoria</th><th>Status</th></tr>
      </thead>
      <tbody id="tbody-contas"></tbody>
    </table>
  </div>
</div>

<!-- Modal Nova Conta -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Nova Conta</h2>
    <label>Descrição</label>
    <input type="text" id="modal-descricao" placeholder="Ex: Energia CELESC">
    <label>Valor (R$)</label>
    <input type="number" step="0.01" id="modal-valor" placeholder="850,00">
    <label>Data de Vencimento</label>
    <input type="date" id="modal-vencimento">
    <label>Categoria</label>
    <select id="modal-categoria"></select>
    <label>Fornecedor</label>
    <input type="text" id="modal-fornecedor" placeholder="Nome do fornecedor">
    <label>Observação</label>
    <textarea id="modal-obs" rows="2"></textarea>
    <div class="btn-row">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarConta()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ── Config Supabase (chave anon COMPLETA — corrigido!) ──
const SUPABASE_URL = 'https://ibcjuyvaygavvvbyslmt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliY2p1eXZheWdhdnZ2YnlzbG10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDMzNDIsImV4cCI6MjEwMDgxOTM0Mn0.8ukYMfQ8Ef-prDdtyjV7PCDp8ocih1pacW1Yr6CxnXM';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let chartCategoria = null;
let chartVencimentos = null;

// ── Auth ──
async function login() {
  try {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.style.display = 'none';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = error.message;
      errorEl.style.display = 'block';
      return;
    }
    mostrarDashboard();
  } catch (e) {
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = 'Erro: ' + e.message;
    errorEl.style.display = 'block';
    console.error('Exceção no login:', e);
  }
}

async function logout() {
  try {
    await supabaseClient.auth.signOut();
  } catch (e) {
    console.error('Erro no logout:', e);
  }
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) mostrarDashboard();
  } catch (e) {
    console.error('Erro ao verificar sessão:', e);
  }
}

async function mostrarDashboard() {
  try {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    const { data: { user } } = await supabaseClient.auth.getUser();
    document.getElementById('user-email').textContent = user?.email || '';
    const hoje = new Date();
    document.getElementById('filtro-mes').value = hoje.toISOString().slice(0,7);
    await carregarDados();
    await carregarCategorias();
  } catch (e) {
    console.error('Erro em mostrarDashboard:', e);
  }
}

// ── Dados ──
async function carregarDados() {
  document.getElementById('loading-indicator').style.display = 'block';
  document.getElementById('tabela-contas').style.display = 'none';
  document.getElementById('tbody-contas').innerHTML = '';

  try {
    // LEFT JOIN (sem !inner) — se categoria_id for NULL ou orfão, ainda retorna o pagamento
    let query = supabaseClient.from('pagamentos').select('*, categorias(nome,cor_hex)', { count: 'exact' });

    const status = document.getElementById('filtro-status').value;
    if (status) query = query.eq('status', status);

    const mes = document.getElementById('filtro-mes').value;
    if (mes) {
      const inicio = mes + '-01';
      const [ano, mesNum] = mes.split('-').map(Number);
      const ultimoDia = new Date(ano, mesNum, 0).getDate();
      const fim = mes + '-' + String(ultimoDia).padStart(2, '0');
      query = query.gte('data_vencimento', inicio).lte('data_vencimento', fim);
    }

    const busca = document.getElementById('filtro-busca').value.trim();
    if (busca) query = query.ilike('descricao', `%${busca}%`);

    query = query.order('data_vencimento', { ascending: false });

    const { data, error } = await query;

    if (error) {
      document.getElementById('tbody-contas').innerHTML =
        `<tr><td colspan="5" class="error-msg">Erro: ${error.message}</td></tr>`;
      document.getElementById('tabela-contas').style.display = 'table';
      return;
    }

    document.getElementById('tabela-contas').style.display = 'table';
    const tbody = document.getElementById('tbody-contas');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:30px;">Nenhuma conta encontrada</td></tr>';
      atualizarCards([]);
      atualizarGraficos([]);
      return;
    }

    data.forEach(c => {
      const venc = new Date(c.data_vencimento + 'T12:00:00');
      const hoje = new Date();
      const statusReal = (!c.data_pagamento && venc < hoje) ? 'atrasado' : c.status;
      const cor = c.categorias?.cor_hex || '#888';
      const catNome = c.categorias?.nome || '—';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${c.descricao}</strong></td>
        <td style="color:#f97316;font-weight:600;">R$ ${Number(c.valor).toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
        <td>${new Date(c.data_vencimento + 'T12:00:00').toLocaleDateString('pt-BR')}</td>
        <td><span style="color:${cor}">●</span> ${catNome}</td>
        <td><span class="status-badge ${statusReal}">${statusReal}</span></td>
      `;
      tbody.appendChild(tr);
    });

    atualizarCards(data);
    atualizarGraficos(data);
  } catch (e) {
    console.error('Exceção em carregarDados:', e);
    document.getElementById('tbody-contas').innerHTML =
      `<tr><td colspan="5" class="error-msg">Erro inesperado: ${e.message}</td></tr>`;
    document.getElementById('tabela-contas').style.display = 'table';
  } finally {
    // GARANTIA: loading-indicator SEMPRE desaparece, em caso de sucesso OU erro
    document.getElementById('loading-indicator').style.display = 'none';
  }
}

function atualizarCards(data) {
  // Proteção contra data não ser array
  if (!Array.isArray(data)) data = [];

  let pendente = 0, pago = 0, atrasado = 0, total = 0;
  const hoje = new Date();
  data.forEach(c => {
    const venc = new Date(c.data_vencimento + 'T12:00:00');
    const s = (!c.data_pagamento && venc < hoje) ? 'atrasado' : c.status;
    if (s === 'pendente') pendente += Number(c.valor);
    else if (s === 'pago') pago += Number(c.valor);
    else if (s === 'atrasado') atrasado += Number(c.valor);
    total += Number(c.valor);
  });
  document.getElementById('card-pendente').textContent = 'R$ ' + pendente.toLocaleString('pt-BR', {minimumFractionDigits:2});
  document.getElementById('card-pago').textContent = 'R$ ' + pago.toLocaleString('pt-BR', {minimumFractionDigits:2});
  document.getElementById('card-atrasado').textContent = 'R$ ' + atrasado.toLocaleString('pt-BR', {minimumFractionDigits:2});
  document.getElementById('card-total').textContent = 'R$ ' + total.toLocaleString('pt-BR', {minimumFractionDigits:2});
}

function atualizarGraficos(data) {
  // Proteção contra data não ser array
  if (!Array.isArray(data)) data = [];

  // Pizza por categoria
  const cats = {};
  data.forEach(c => {
    const nome = c.categorias?.nome || 'Sem categoria';
    const cor = c.categorias?.cor_hex || '#888';
    if (!cats[nome]) cats[nome] = { valor: 0, cor };
    cats[nome].valor += Number(c.valor);
  });

  if (chartCategoria) chartCategoria.destroy();
  chartCategoria = new Chart(document.getElementById('chart-categoria'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(cats),
      datasets: [{
        data: Object.values(cats).map(v => v.valor),
        backgroundColor: Object.values(cats).map(v => v.cor),
        borderWidth: 0
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#888', padding: 12 } }
      }
    }
  });

  // Barras de vencimentos
  const dias = {};
  data.forEach(c => {
    if (c.status === 'pago') return;
    const d = c.data_vencimento;
    dias[d] = (dias[d] || 0) + Number(c.valor);
  });

  if (chartVencimentos) chartVencimentos.destroy();
  chartVencimentos = new Chart(document.getElementById('chart-vencimentos'), {
    type: 'bar',
    data: {
      labels: Object.keys(dias).sort().map(d => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR')),
      datasets: [{
        label: 'Valor a pagar',
        data: Object.keys(dias).sort().map(d => dias[d]),
        backgroundColor: '#f97316',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, ticks: { color:'#666', callback: v => 'R$'+v } },
        x: { ticks: { color:'#666' } }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

// ── Categorias ──
async function carregarCategorias() {
  try {
    const { data, error } = await supabaseClient.from('categorias').select('*').order('nome');
    if (error) {
      console.error('Erro ao carregar categorias:', error.message);
      return;
    }
    const sel = document.getElementById('modal-categoria');
    sel.innerHTML = '<option value="">Selecione...</option>';
    (data || []).forEach(c => {
      sel.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
    });
  } catch (e) {
    console.error('Exceção ao carregar categorias:', e);
  }
}

// ── Modal ──
function abrirModal() {
  document.getElementById('modal-title').textContent = 'Nova Conta';
  document.getElementById('modal-descricao').value = '';
  document.getElementById('modal-valor').value = '';
  document.getElementById('modal-vencimento').value = '';
  document.getElementById('modal-categoria').value = '';
  document.getElementById('modal-fornecedor').value = '';
  document.getElementById('modal-obs').value = '';
  document.getElementById('modal-overlay').classList.add('active');
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}

async function salvarConta() {
  try {
    const descricao = document.getElementById('modal-descricao').value;
    const valor = parseFloat(document.getElementById('modal-valor').value);
    const vencimento = document.getElementById('modal-vencimento').value;
    const categoria_id = document.getElementById('modal-categoria').value || null;
    const fornecedorNome = document.getElementById('modal-fornecedor').value;
    const observacao = document.getElementById('modal-obs').value;

    if (!descricao || !valor || !vencimento) {
      alert('Preencha descrição, valor e vencimento');
      return;
    }

    const { data: userData } = await supabaseClient.auth.getUser();
    let fornecedor_id = null;
    if (fornecedorNome) {
      const { data: forn, error: errF } = await supabaseClient.from('fornecedores').insert({ nome: fornecedorNome }).select().single();
      if (!errF && forn) fornecedor_id = forn.id;
    }

    const { error } = await supabaseClient.from('pagamentos').insert({
      user_id: userData.user?.id,
      descricao,
      valor,
      data_vencimento: vencimento,
      categoria_id,
      fornecedor_id,
      observacao,
      status: 'pendente'
    });

    if (error) {
      alert('Erro: ' + error.message);
      return;
    }
    fecharModal();
    await carregarDados();
  } catch (e) {
    console.error('Exceção ao salvar conta:', e);
    alert('Erro inesperado: ' + e.message);
  }
}

// ── Init ──
checkSession();
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
